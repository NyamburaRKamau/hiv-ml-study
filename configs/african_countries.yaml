# Standard list of African countries/territories for grouping in Arm C.
# Uses common English short names as they typically appear in WHO/UNESCO
# country-year datasets. Update to match exact naming in your downloaded
# CSV (e.g. "Congo, Dem. Rep." vs "Democratic Republic of the Congo") --
# the pipeline will print any Africa-list names it couldn't match to the
# actual data so mismatches are caught, not silently dropped.

